# EKS 워커 노드 + NAT start / stop (컨트롤 플레인은 유지)
name: EKS start/stop

on:
  workflow_dispatch:
    inputs:
      action:
        description: start | stop | status
        required: true
        type: choice
        options:
          - status
          - stop
          - start
        default: status
      desired_size:
        description: start 시 desired 노드 수
        required: false
        type: string
        default: "2"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'aniverse-eks' }}
  EKS_NODEGROUP_NAME: ${{ vars.EKS_NODEGROUP_NAME || 'aniverse-nodes' }}
  EKS_NAT_NAME: ${{ vars.EKS_NAT_NAME || 'aniverse-nat-instance' }}

jobs:
  scale:
    runs-on: ubuntu-latest
    # stop 은 ASG drain + NAT stop 대기 (최대 ~15분)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Resolve auth
        id: auth
        run: |
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ] && [ "${{ vars.AWS_USE_OIDC }}" = "true" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS (OIDC)
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-eks-start-stop
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS (access keys)
        if: steps.auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show target
        run: |
          {
            echo "cluster=${EKS_CLUSTER_NAME}"
            echo "nodegroups=${EKS_NODEGROUP_NAME}"
            echo "nat=${EKS_NAT_NAME}"
            echo "action=${{ inputs.action }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run eks script
        env:
          EKS_DESIRED_SIZE: ${{ inputs.desired_size }}
          EKS_WAIT_TIMEOUT_SEC: "900"
        run: |
          chmod +x scripts/eks-stop.sh scripts/eks-start.sh scripts/eks-status.sh
          case "${{ inputs.action }}" in
            stop)   ./scripts/eks-stop.sh ;;
            start)  ./scripts/eks-start.sh ;;
            status) ./scripts/eks-status.sh ;;
            *) echo "bad action"; exit 1 ;;
          esac

      - name: Verify stop (ASG empty + NAT stopped)
        if: inputs.action == 'stop'
        run: |
          set -euo pipefail
          fail=0
          for ng in ${EKS_NODEGROUP_NAME}; do
            ASG=$(aws eks describe-nodegroup --region "${AWS_REGION}" \
              --cluster-name "${EKS_CLUSTER_NAME}" --nodegroup-name "${ng}" \
              --query 'nodegroup.resources.autoScalingGroups[0].name' --output text)
            DESIRED=$(aws autoscaling describe-auto-scaling-groups --region "${AWS_REGION}" \
              --auto-scaling-group-names "${ASG}" \
              --query 'AutoScalingGroups[0].DesiredCapacity' --output text)
            INST=$(aws autoscaling describe-auto-scaling-groups --region "${AWS_REGION}" \
              --auto-scaling-group-names "${ASG}" \
              --query 'length(AutoScalingGroups[0].Instances)' --output text)
            echo "ASG ${ASG}: Desired=${DESIRED} Instances=${INST}" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "${DESIRED}" != "0" ] || [ "${INST}" != "0" ]; then
              echo "::error::ASG not empty Desired=${DESIRED} Instances=${INST}"
              fail=1
            fi
          done
          NAT_JSON=$(aws ec2 describe-instances --region "${AWS_REGION}" \
            --filters "Name=tag:Name,Values=${EKS_NAT_NAME}" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].[InstanceId,State.Name]' --output json)
          echo "NAT: ${NAT_JSON}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "${NAT_JSON}" | python3 -c '
          import json,sys
          rows=json.load(sys.stdin)
          bad=[r for r in rows if r[1] not in ("stopped","stopping")]
          if not rows:
            print("WARN: NAT not found", file=sys.stderr)
          if bad:
            raise SystemExit(f"NAT not stopped: {bad}")
          '
          if [ "${fail}" != "0" ]; then exit 1; fi
          echo "### stop verified: workers=0, NAT stopped" >> "$GITHUB_STEP_SUMMARY"
