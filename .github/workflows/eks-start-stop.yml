# EKS 워커 노드 start / stop (컨트롤 플레인은 유지)
name: EKS start/stop

on:
  workflow_dispatch:
    inputs:
      action:
        description: start | stop | status
        required: true
        type: choice
        options:
          - status
          - stop
          - start
        default: status
      desired_size:
        description: start 시 desired 노드 수
        required: false
        type: string
        default: "2"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  # Terraform module.eks 기본값과 동일. Variables 있으면 그 값을 우선.
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'aniverse-eks' }}
  EKS_NODEGROUP_NAME: ${{ vars.EKS_NODEGROUP_NAME || 'aniverse-nodes' }}

jobs:
  scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve auth
        id: auth
        run: |
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ] && [ "${{ vars.AWS_USE_OIDC }}" = "true" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS (OIDC)
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-eks-start-stop
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS (access keys)
        if: steps.auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show target
        run: |
          echo "cluster=${EKS_CLUSTER_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "nodegroups=${EKS_NODEGROUP_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "action=${{ inputs.action }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Using cluster=${EKS_CLUSTER_NAME} nodegroup=${EKS_NODEGROUP_NAME}"

      - name: Run eks script
        env:
          EKS_DESIRED_SIZE: ${{ inputs.desired_size }}
        run: |
          chmod +x scripts/eks-stop.sh scripts/eks-start.sh scripts/eks-status.sh
          case "${{ inputs.action }}" in
            stop)   ./scripts/eks-stop.sh ;;
            start)  ./scripts/eks-start.sh ;;
            status) ./scripts/eks-status.sh ;;
            *) echo "bad action"; exit 1 ;;
          esac

      - name: Verify nodegroup scaling
        if: inputs.action == 'stop' || inputs.action == 'status' || inputs.action == 'start'
        run: |
          set -euo pipefail
          for ng in ${EKS_NODEGROUP_NAME}; do
            echo "### ${EKS_CLUSTER_NAME}/${ng}" >> "$GITHUB_STEP_SUMMARY"
            aws eks describe-nodegroup \
              --region "${AWS_REGION}" \
              --cluster-name "${EKS_CLUSTER_NAME}" \
              --nodegroup-name "${ng}" \
              --query 'nodegroup.{status:status,scaling:scalingConfig}' \
              --output json | tee /tmp/ng.json
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/ng.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${{ inputs.action }}" = "stop" ]; then
            DESIRED=$(python3 -c "import json; print(json.load(open('/tmp/ng.json'))['scaling']['desiredSize'])")
            # EKS API maxSize 최소 1 — stop 스크립트는 max=1 + ASG Launch suspend
            if [ "${DESIRED}" != "0" ]; then
              echo "::error::stop expected desiredSize=0, got ${DESIRED}"
              exit 1
            fi
            echo "stop OK: desiredSize=0 (ASG Launch should be suspended)"
          fi
