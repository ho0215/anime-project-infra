# EKS에 Argo CD 설치 + aniverse Helm(ALB/HTTPS) 복구
name: "Argo CD on EKS"

on:
  workflow_dispatch:
    inputs:
      sync:
        description: "Argo Application sync 실행"
        type: boolean
        default: true
      anime_ref:
        description: "anime-project git ref (HTTPS values)"
        type: string
        default: "main"
      bind_domain:
        description: "eks-bind-domain (Route53 alias + ACM HTTPS)"
        type: boolean
        default: true
      helm_restore:
        description: "Argo 실패 시 helm upgrade로 Ingress/앱 복구"
        type: boolean
        default: true
  push:
    branches: [cursor/argocd-eks-8e41]
    paths:
      - ".github/workflows/argocd-eks.yml"
      - "scripts/argocd-eks-via-oidc.sh"

permissions:
  contents: read
  id-token: write

concurrency:
  group: argocd-eks
  cancel-in-progress: true

jobs:
  install:
    name: Install / restore ALB HTTPS
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'aniverse-eks' }}
      ACM_CERT_ARN: arn:aws:acm:ap-northeast-2:841535407395:certificate/da27663b-d716-4eaa-98ba-2ea5653bdb71
      ACM_WAIT_SEC: "600"
    steps:
      - uses: actions/checkout@v4

      - name: Check OIDC Variables
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ] || [ "${{ vars.AWS_USE_OIDC }}" != "true" ]; then
            echo "::error::Need AWS_ROLE_ARN + AWS_USE_OIDC=true"
            exit 1
          fi
          echo "cluster=${EKS_CLUSTER_NAME}" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-argocd-eks
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl + helm
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: kubeconfig
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"
          kubectl cluster-info
          kubectl get nodes -o wide
          kubectl -n kube-system get deploy aws-load-balancer-controller -o wide || true

      - name: Checkout anime-project
        uses: actions/checkout@v4
        with:
          repository: ho0215/anime-project
          ref: ${{ inputs.anime_ref || 'main' }}
          path: anime-project

      - name: ACM + DNS snapshot
        run: |
          set +e
          aws acm describe-certificate --region "${AWS_REGION}" \
            --certificate-arn "${ACM_CERT_ARN}" \
            --query 'Certificate.{Status:Status,SANs:SubjectAlternativeNames}' \
            --output json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          dig +short NS aniverse.my @8.8.8.8 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Seed aniverse-app-secrets
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          kubectl get ns aniverse >/dev/null 2>&1 || kubectl create ns aniverse
          if kubectl -n aniverse get secret aniverse-app-secrets >/dev/null 2>&1; then
            echo "live aniverse-app-secrets already present"
            exit 0
          fi
          # GitHub Secrets 우선. 없으면 lab/docker 기본값으로 시드(신 계정 빈 클러스터 복구용).
          # 운영 비밀번호는 이후 Secrets 등록 후 secret 교체 권장.
          DJANGO="${DJANGO_SECRET_KEY}"
          DBPASS="${DB_PASSWORD}"
          ROOTPASS="${DB_ROOT_PASSWORD}"
          SRC="github-secrets"
          if [ -z "${DJANGO}" ] || [ -z "${DBPASS}" ] || [ -z "${ROOTPASS}" ]; then
            DJANGO="${DJANGO:-$(openssl rand -hex 32)}"
            DBPASS="${DBPASS:-aniversepass}"
            ROOTPASS="${ROOTPASS:-aniversepass}"
            SRC="lab-fallback(aniversepass + random DJANGO)"
            echo "::warning::GitHub Secrets 없음 — ${SRC} 으로 aniverse-app-secrets 생성. 운영키면 Secrets 등록 후 재생성하세요."
          fi
          kubectl -n aniverse create secret generic aniverse-app-secrets \
            --from-literal=DJANGO_SECRET_KEY="${DJANGO}" \
            --from-literal=DB_PASSWORD="${DBPASS}" \
            --from-literal=DB_ROOT_PASSWORD="${ROOTPASS}"
          echo "seeded aniverse-app-secrets via ${SRC}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install PyYAML (Application patch)
        run: pip install --quiet pyyaml

      - name: Run argocd-eks-install.sh
        id: argo
        continue-on-error: true
        env:
          SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.sync || 'true' }}
        run: |
          set -euo pipefail
          chmod +x anime-project/scripts/argocd-eks-install.sh
          bash anime-project/scripts/argocd-eks-install.sh

      # live Application 에 ServerSideApply 가 남으면 terminatingReplicas ComparisonError
      # → sync=Unknown / health=Missing (Job 미생성) 고착. apply 로는 배열 항목이
      # 안 지워질 수 있어 JSON replace 로 강제 제거 + hard refresh + apply sync.
      - name: Strip ServerSideApply / clear ComparisonError
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! kubectl -n argocd get app aniverse-eks >/dev/null 2>&1; then
            echo "no aniverse-eks Application yet"
            exit 0
          fi
          echo "==> force syncOptions without ServerSideApply"
          kubectl -n argocd patch application aniverse-eks --type=json -p='[
            {"op":"replace","path":"/spec/syncPolicy/syncOptions","value":["CreateNamespace=true","RespectIgnoreDifferences=true"]}
          ]' || true
          # terminatingReplicas ignore (구 Application 에 없을 수 있음)
          kubectl -n argocd patch application aniverse-eks --type merge -p '{
            "spec":{
              "ignoreDifferences":[
                {"group":"apps","kind":"Deployment","jqPathExpressions":[".spec.replicas",".status.terminatingReplicas"]},
                {"group":"apps","kind":"StatefulSet","jqPathExpressions":[".status.terminatingReplicas"]},
                {"group":"","kind":"Secret","name":"aniverse-app-secrets","jsonPointers":["/data","/stringData"]}
              ]
            }
          }' || true
          kubectl -n argocd patch application aniverse-eks --type=json \
            -p='[{"op":"remove","path":"/operation"}]' 2>/dev/null || true
          kubectl -n argocd annotate application aniverse-eks \
            argocd.argoproj.io/refresh=hard --overwrite || true
          kubectl -n argocd patch application aniverse-eks --type merge -p \
            '{"operation":{"initiatedBy":{"username":"ci-strip-ssa"},"sync":{"revision":"HEAD","syncStrategy":{"apply":{"force":false}},"syncOptions":["CreateNamespace=true","RespectIgnoreDifferences=true"]}}}' \
            || true
          for i in $(seq 1 36); do
            SYNC_ST=$(kubectl -n argocd get app aniverse-eks -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            HEALTH=$(kubectl -n argocd get app aniverse-eks -o jsonpath='{.status.health.status}' 2>/dev/null || true)
            COND=$(kubectl -n argocd get app aniverse-eks -o jsonpath='{.status.conditions[*].type}' 2>/dev/null || true)
            OPTS=$(kubectl -n argocd get app aniverse-eks -o jsonpath='{.spec.syncPolicy.syncOptions}' 2>/dev/null || true)
            echo "  [$i] sync=${SYNC_ST} health=${HEALTH} opts=${OPTS}"
            if [ "${SYNC_ST}" = "Synced" ] && [ "${HEALTH}" = "Healthy" ]; then
              exit 0
            fi
            if echo "${COND}" | grep -q ComparisonError && echo "${OPTS}" | grep -q ServerSideApply; then
              kubectl -n argocd patch application aniverse-eks --type=json -p='[
                {"op":"replace","path":"/spec/syncPolicy/syncOptions","value":["CreateNamespace=true","RespectIgnoreDifferences=true"]}
              ]' || true
            fi
            if [ $((i % 6)) -eq 0 ]; then
              kubectl -n argocd get app aniverse-eks \
                -o jsonpath='{range .status.resources[*]}{.kind}/{.name} sync={.status} health={.health.status}{"\n"}{end}' \
                2>/dev/null | head -40 || true
            fi
            sleep 5
          done
          kubectl -n argocd get app aniverse-eks -o wide || true
          kubectl -n argocd get app aniverse-eks -o jsonpath='{.status.conditions}' ; echo

      - name: Helm restore (adopt Argo-created resources)
        if: ${{ inputs.helm_restore != false }}
        id: helm
        continue-on-error: true
        run: |
          set -euo pipefail
          DJANGO=$(kubectl -n aniverse get secret aniverse-app-secrets -o jsonpath='{.data.DJANGO_SECRET_KEY}' | base64 -d)
          DBPASS=$(kubectl -n aniverse get secret aniverse-app-secrets -o jsonpath='{.data.DB_PASSWORD}' | base64 -d)
          ROOTPASS=$(kubectl -n aniverse get secret aniverse-app-secrets -o jsonpath='{.data.DB_ROOT_PASSWORD}' | base64 -d)

          # Argo가 먼저 만든 오브젝트는 Helm ownership annotation 이 없어
          # `helm install` 이 NetworkPolicy 등에서 막힘 → adopt 후 upgrade
          echo "==> adopt existing aniverse resources for Helm"
          kubectl -n aniverse get networkpolicy,ingress,svc,deploy,sts,hpa,sa,secret,pvc,job,cm \
            -o name 2>/dev/null | while read -r obj; do
            case "$obj" in
              secret/aniverse-app-secrets) continue ;;  # live secret — ignoreDifferences
            esac
            kubectl -n aniverse annotate "$obj" \
              meta.helm.sh/release-name=aniverse \
              meta.helm.sh/release-namespace=aniverse \
              --overwrite 2>/dev/null || true
            kubectl -n aniverse label "$obj" app.kubernetes.io/managed-by=Helm --overwrite 2>/dev/null || true
          done

          TAKE_OWN=()
          if helm upgrade --help 2>/dev/null | grep -q take-ownership; then
            TAKE_OWN=(--take-ownership)
          fi

          helm upgrade --install aniverse ./anime-project/deploy/helm/aniverse \
            -n aniverse --create-namespace \
            -f ./anime-project/deploy/helm/aniverse/values-eks.yaml \
            --set-string "secrets.DJANGO_SECRET_KEY=${DJANGO}" \
            --set-string "secrets.DB_PASSWORD=${DBPASS}" \
            --set-string "secrets.DB_ROOT_PASSWORD=${ROOTPASS}" \
            "${TAKE_OWN[@]}" \
            --timeout 15m
          kubectl -n aniverse get pods,ingress -o wide
          kubectl -n aniverse get ingress aniverse-web -o yaml | sed -n '1,80p' || true

      - name: Ensure public subnet ELB tags
        continue-on-error: true
        run: |
          set -euo pipefail
          CLUSTER="${EKS_CLUSTER_NAME}"
          VPC="$(aws eks describe-cluster --name "${CLUSTER}" --region "${AWS_REGION}" \
            --query 'cluster.resourcesVpcConfig.vpcId' --output text)"
          # mapPublicIpOnLaunch=true 인 서브넷을 public 으로 보고 ELB 태그 부여
          mapfile -t PUB < <(aws ec2 describe-subnets --region "${AWS_REGION}" \
            --filters "Name=vpc-id,Values=${VPC}" "Name=map-public-ip-on-launch,Values=true" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' '\n')
          mapfile -t PRIV < <(aws ec2 describe-subnets --region "${AWS_REGION}" \
            --filters "Name=vpc-id,Values=${VPC}" "Name=map-public-ip-on-launch,Values=false" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' '\n')
          for s in "${PUB[@]}"; do
            [ -z "$s" ] && continue
            aws ec2 create-tags --region "${AWS_REGION}" --resources "$s" --tags \
              "Key=kubernetes.io/role/elb,Value=1" \
              "Key=kubernetes.io/cluster/${CLUSTER},Value=shared"
            echo "tagged public $s"
          done
          for s in "${PRIV[@]}"; do
            [ -z "$s" ] && continue
            aws ec2 create-tags --region "${AWS_REGION}" --resources "$s" --tags \
              "Key=kubernetes.io/role/internal-elb,Value=1" \
              "Key=kubernetes.io/cluster/${CLUSTER},Value=shared"
            echo "tagged private $s"
          done

      - name: Wait Ingress ALB
        id: alb
        if: always()
        run: |
          set -euo pipefail
          # Ingress 없으면 실패
          if ! kubectl -n aniverse get ingress aniverse-web >/dev/null 2>&1; then
            echo "::error::ingress aniverse-web 없음 (helm/argo 배포 실패)"
            kubectl -n aniverse get all,ingress -o wide || true
            exit 1
          fi
          # 컨트롤러 reconcile 유도
          kubectl -n aniverse annotate ingress aniverse-web \
            aniverse.force-reconcile="$(date +%s)" --overwrite || true

          for i in $(seq 1 60); do
            ALB="$(kubectl -n aniverse get ingress aniverse-web \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [ -n "${ALB}" ]; then
              echo "alb=${ALB}" >> "$GITHUB_OUTPUT"
              echo "ALB=${ALB}" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "waiting ALB (${i}/60)"
            kubectl -n aniverse get ingress aniverse-web -o wide 2>&1 || true
            if [ $((i % 6)) -eq 0 ]; then
              kubectl -n aniverse describe ingress aniverse-web 2>&1 | tail -40 || true
              kubectl -n kube-system logs deploy/aws-load-balancer-controller --tail=40 2>&1 || true
            fi
            sleep 15
          done
          kubectl -n kube-system logs deploy/aws-load-balancer-controller --tail=150 || true
          kubectl -n aniverse describe ingress aniverse-web || true
          echo "::error::Ingress ALB 없음"
          exit 1

      - name: Bind domain (Route53 + HTTPS)
        if: ${{ inputs.bind_domain != false && steps.alb.outputs.alb != '' }}
        run: |
          set -euo pipefail
          chmod +x anime-project/scripts/eks-bind-domain.sh
          ACM_CERT_ARN="${ACM_CERT_ARN}" ACM_WAIT_SEC="${ACM_WAIT_SEC}" \
            bash anime-project/scripts/eks-bind-domain.sh aniverse.my

      - name: Summarize / health
        if: always()
        run: |
          set +e
          {
            echo "### Argo / Ingress"
            echo '```'
            kubectl -n argocd get app aniverse-eks -o wide 2>&1 || true
            kubectl -n aniverse get pods,ingress -o wide 2>&1 || true
            echo
            dig +short NS aniverse.my @8.8.8.8
            dig +short A aniverse.my @8.8.8.8
            curl -sS -m 20 -o /dev/null -w "http=%{http_code}\n" http://aniverse.my/health/ || true
            curl -sS -m 20 -ko /dev/null -w "https=%{http_code}\n" https://aniverse.my/health/ || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ALB="${{ steps.alb.outputs.alb }}"
          if [ -z "${ALB}" ]; then
            echo "::error::ALB hostname missing"
            exit 1
          fi
          echo "OK ALB=${ALB}"