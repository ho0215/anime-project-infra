# Point Argo at chart branch, sync, wait for db-restore Job (non-hook)
name: "Verify DB restore Job"

on:
  workflow_dispatch:
  push:
    branches: [cursor/db-restore-auto-8e41]
    paths:
      - ".github/workflows/verify-db-restore.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: argocd-eks
  cancel-in-progress: false

jobs:
  verify:
    name: Sync Argo → wait db-restore Job
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'aniverse-eks' }}
      APP_REF: cursor/db-restore-auto-8e41
    steps:
      - name: Check OIDC
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ] || [ "${{ vars.AWS_USE_OIDC }}" != "true" ]; then
            echo "::error::Need AWS_ROLE_ARN + AWS_USE_OIDC=true"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-verify-db-restore
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: kubeconfig
        run: |
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"
          kubectl get nodes

      - name: Clear stuck hook Job + point Argo at branch
        run: |
          set -euo pipefail
          kubectl -n aniverse delete job aniverse-db-restore --ignore-not-found
          # Drop stale SyncError condition by refreshing after patch
          kubectl -n argocd patch application aniverse-eks --type=json -p="[
            {\"op\":\"replace\",\"path\":\"/spec/source/targetRevision\",\"value\":\"${APP_REF}\"}
          ]"
          kubectl -n argocd annotate application aniverse-eks \
            argocd.argoproj.io/refresh=hard --overwrite
          kubectl -n argocd patch application aniverse-eks --type merge -p \
            '{"operation":{"initiatedBy":{"username":"ci-db-restore"},"sync":{"prune":false,"syncStrategy":{"hook":{}},"syncOptions":["CreateNamespace=true","RespectIgnoreDifferences=true","ApplyOutOfSyncOnly=true"]}}}' \
            || true

      - name: Wait Synced/Healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            ST=$(kubectl -n argocd get app aniverse-eks -o jsonpath='{.status.sync.status}' || true)
            HL=$(kubectl -n argocd get app aniverse-eks -o jsonpath='{.status.health.status}' || true)
            OP=$(kubectl -n argocd get app aniverse-eks -o jsonpath='{.status.operationState.phase}' || true)
            MSG=$(kubectl -n argocd get app aniverse-eks -o jsonpath='{.status.operationState.message}' || true)
            echo "[$i] sync=$ST health=$HL op=$OP msg=${MSG:-}"
            if [ "$OP" = "Failed" ] || [ "$OP" = "Error" ]; then
              echo "::error::Argo operation failed: $MSG"
              kubectl -n argocd get app aniverse-eks -o yaml | head -160
              exit 1
            fi
            if [ "$ST" = "Synced" ] && [ "$HL" = "Healthy" ] && { [ -z "$OP" ] || [ "$OP" = "Succeeded" ]; }; then
              break
            fi
            # Synced+Healthy while op Running on non-hook job is OK once resources applied
            if [ "$ST" = "Synced" ] && [ "$HL" = "Healthy" ] && [ "$i" -gt 12 ]; then
              break
            fi
            sleep 5
          done

      - name: Wait Job + dump diagnostics on failure
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if kubectl -n aniverse get job aniverse-db-restore >/dev/null 2>&1; then
              break
            fi
            echo "waiting for Job to appear ($i)"
            sleep 5
          done
          kubectl -n aniverse get job aniverse-db-restore -o wide || true
          if ! kubectl -n aniverse wait --for=condition=complete job/aniverse-db-restore --timeout=360s; then
            echo "::error::Job did not complete"
            kubectl -n aniverse describe job aniverse-db-restore || true
            kubectl -n aniverse get pods -l job-name=aniverse-db-restore -o wide || true
            kubectl -n aniverse describe pods -l job-name=aniverse-db-restore || true
            kubectl -n aniverse logs -l job-name=aniverse-db-restore --all-containers --tail=200 || true
            exit 1
          fi
          kubectl -n aniverse logs job/aniverse-db-restore --tail=100
          SUCC=$(kubectl -n aniverse get job aniverse-db-restore -o jsonpath='{.status.succeeded}')
          test "${SUCC}" = "1"
          echo "### DB restore Job OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke site
        run: curl -fsS -o /dev/null -w "health=%{http_code}\n" https://aniverse.my/health/

# chart fix bcdd54d+/rewrite
