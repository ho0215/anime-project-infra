# Terraform destroy(force_destroy) 후 버킷이 비는 것과 동일하게
# media/static 객체를 지운 뒤 git → S3 복구가 되는지 검증한다.
name: "Verify S3 wipe → restore (destroy 시뮬레이션)"

on:
  workflow_dispatch:
  push:
    branches: [main, cursor/**]
    paths:
      - ".github/workflows/verify-s3-wipe-restore.yml"
      - "scripts/restore-s3-assets.sh"

permissions:
  contents: read
  id-token: write

# Sync media 워크플로와 버킷을 동시에 건드리지 않음 (이전 실패: wipe 직후 sync 가 재업로드 → 200)
concurrency:
  group: s3-static-assets
  cancel-in-progress: false

jobs:
  wipe-and-restore:
    name: Wipe S3 assets → sync → probe
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
      STATIC_BUCKET_NAME: aniverse-static-679583587966-ap-northeast-2
    steps:
      - name: Check OIDC Variables
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ] || [ "${{ vars.AWS_USE_OIDC }}" != "true" ]; then
            echo "::error::Need AWS_ROLE_ARN + AWS_USE_OIDC=true"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-verify-s3-wipe
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/checkout@v4

      - name: Checkout anime-project
        uses: actions/checkout@v4
        with:
          repository: ho0215/anime-project
          ref: main
          path: anime-project

      - name: Wipe media/static prefixes (simulate empty bucket after destroy)
        run: |
          set -euo pipefail
          KEY='goods_images/타마마.jpeg'
          for p in goods_images works_images community img css; do
            echo "Removing s3://${STATIC_BUCKET_NAME}/${p}/"
            aws s3 rm "s3://${STATIC_BUCKET_NAME}/${p}/" --recursive --region "${AWS_REGION}" || true
          done
          # 공개 HTTP 대신 HeadObject 로 삭제 확인 (병렬 sync 레이스·403/404 애매함 방지)
          if aws s3api head-object --bucket "${STATIC_BUCKET_NAME}" --key "${KEY}" --region "${AWS_REGION}" 2>/dev/null; then
            echo "::error::Object still present after wipe: ${KEY}"
            exit 1
          fi
          echo "Confirmed absent: s3://${STATIC_BUCKET_NAME}/${KEY}"
          echo "- after wipe: \`${KEY}\` **absent** (HeadObject miss)" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore from anime-project (media + static)
        run: |
          set -euo pipefail
          chmod +x scripts/restore-s3-assets.sh
          APP_DIR="$PWD/anime-project" \
            STATIC_BUCKET_NAME="${STATIC_BUCKET_NAME}" \
            AWS_REGION="${AWS_REGION}" \
            bash scripts/restore-s3-assets.sh

      - name: Probe media + favicon 200
        run: |
          set -euo pipefail
          ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('타마마.jpeg'))")
          GOODS="https://${STATIC_BUCKET_NAME}.s3.${AWS_REGION}.amazonaws.com/goods_images/${ENC}"
          FAV="https://${STATIC_BUCKET_NAME}.s3.${AWS_REGION}.amazonaws.com/img/favicon-32.png"
          for URL in "$GOODS" "$FAV"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "$URL → $CODE"
            echo "- \`$URL\` → **$CODE**" >> "$GITHUB_STEP_SUMMARY"
            test "$CODE" = "200"
          done
