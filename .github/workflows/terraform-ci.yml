name: "Terraform CI (Plan on PR)"

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/dev/**"
      - "modules/**"
      - "bootstrap/**"
      - ".github/workflows/terraform*.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  plan:
    name: Format / Validate / Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev
    env:
      AWS_REGION: ap-northeast-2
      TF_VERSION: "1.10.5"
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_django_secret_key: ${{ secrets.TF_VAR_DJANGO_SECRET_KEY }}
      TF_VAR_gemini_api_key: ${{ secrets.TF_VAR_GEMINI_API_KEY }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_db_snapshot_identifier: ${{ secrets.TF_VAR_DB_SNAPSHOT_IDENTIFIER }}
      TF_VAR_restore_from_latest_snapshot: ${{ vars.TF_VAR_RESTORE_FROM_LATEST_SNAPSHOT || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive ../..

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock-timeout=10m -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            let plan = '';
            try { plan = fs.readFileSync('environments/dev/plan.txt', 'utf8'); } catch (e) { plan = '(plan file missing)'; }
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;
            const body = `### Terraform Plan (dev)\n\`\`\`\n${truncated}\n\`\`\`\n*fmt: ${{ steps.fmt.outcome }} / plan: ${{ steps.plan.outcome }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
