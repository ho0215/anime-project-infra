# DB/인프라 복구 후 S3 객체가 비어 있을 때
# anime-project media/ + static/(css·img) → 버킷 동기화
name: "Sync media → S3"

on:
  workflow_dispatch:
  push:
    branches: [main, cursor/**]
    paths:
      - ".github/workflows/sync-media-s3.yml"
      - "scripts/restore-s3-assets.sh"
  # Terraform apply 성공 후 자산도 호출 가능 (workflow_call)
  workflow_call:
    inputs:
      bucket:
        description: "static/media 버킷 이름"
        type: string
        required: false
        default: "aniverse-static-679583587966-ap-northeast-2"

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    name: aws s3 sync media+static
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
      STATIC_BUCKET_NAME: ${{ inputs.bucket || 'aniverse-static-679583587966-ap-northeast-2' }}
    steps:
      - name: Check OIDC Variables
        id: auth
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::error::Set Variable AWS_ROLE_ARN (github_actions_role_arn)"
            exit 1
          fi
          if [ "${{ vars.AWS_USE_OIDC }}" != "true" ]; then
            echo "::error::Set Variable AWS_USE_OIDC=true"
            exit 1
          fi
          echo "mode=oidc" >> "$GITHUB_OUTPUT"
          {
            echo "### Sync media+static → S3"
            echo "- role: \`${{ vars.AWS_ROLE_ARN }}\`"
            echo "- bucket: \`${STATIC_BUCKET_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-sync-media
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/checkout@v4

      - name: Checkout anime-project
        uses: actions/checkout@v4
        with:
          repository: ho0215/anime-project
          ref: main
          path: anime-project

      - name: Restore media + static assets
        run: |
          set -euo pipefail
          chmod +x scripts/restore-s3-assets.sh
          APP_DIR="$PWD/anime-project" \
            STATIC_BUCKET_NAME="${STATIC_BUCKET_NAME}" \
            AWS_REGION="${AWS_REGION}" \
            bash scripts/restore-s3-assets.sh

      - name: Probe sample object
        run: |
          set -euo pipefail
          SAMPLE=$(aws s3 ls "s3://${STATIC_BUCKET_NAME}/goods_images/" --region "${AWS_REGION}" \
            | awk '{print $NF}' | head -1 || true)
          if [ -z "$SAMPLE" ]; then
            echo "::error::No objects under goods_images/ after sync"
            exit 1
          fi
          ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$SAMPLE")
          URL="https://${STATIC_BUCKET_NAME}.s3.${AWS_REGION}.amazonaws.com/goods_images/${ENC}"
          echo "Probe: $URL"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP $CODE"
          echo "- sample: \`$URL\` → **$CODE**" >> "$GITHUB_STEP_SUMMARY"
          test "$CODE" = "200"
