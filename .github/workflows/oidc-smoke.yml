# Terraform / AWS 리소스를 건드리지 않고 OIDC AssumeRole 만 검증
name: "OIDC smoke (infra)"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: AssumeRole + sts get-caller-identity
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
    steps:
      - name: Check Variables
        id: auth
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::error::Set Variable AWS_ROLE_ARN to bootstrap output github_actions_role_arn"
            exit 1
          fi
          if [ "${{ vars.AWS_USE_OIDC }}" != "true" ]; then
            echo "::error::Set Variable AWS_USE_OIDC=true"
            exit 1
          fi
          echo "role=${{ vars.AWS_ROLE_ARN }}" >> "$GITHUB_STEP_SUMMARY"
          echo "### OIDC smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- role: \`${{ vars.AWS_ROLE_ARN }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Debug GitHub OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            const slim = {
              sub: payload.sub,
              aud: payload.aud,
              repository: payload.repository,
              repository_id: payload.repository_id,
              repository_owner: payload.repository_owner,
              repository_owner_id: payload.repository_owner_id,
              ref: payload.ref,
              environment: payload.environment || null,
              job_workflow_ref: payload.job_workflow_ref || null,
            };
            console.log('OIDC claims:', JSON.stringify(slim, null, 2));
            await core.summary
              .addHeading('OIDC claims')
              .addCodeBlock(JSON.stringify(slim, null, 2), 'json')
              .write();

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-oidc-smoke
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}

      - name: sts get-caller-identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "- assumed: \`$ARN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$ARN" | grep -q 'aniverse-github-actions-terraform' \
            || echo "::warning::Expected role name aniverse-github-actions-terraform in Arn"
