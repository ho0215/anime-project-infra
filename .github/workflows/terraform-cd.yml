name: "Terraform CD (Apply / Destroy)"

on:
  push:
    branches:
      - main
    paths:
      - "environments/dev/**"
      - "modules/**"
      - "bootstrap/**"
      - ".github/workflows/terraform*.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "apply 또는 destroy"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform Apply
    if: >
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev
    env:
      AWS_REGION: ap-northeast-2
      TF_VERSION: "1.10.5"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve AWS auth mode
        id: auth
        run: |
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ] && [ "${{ vars.AWS_USE_OIDC }}" = "true" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          fi
          echo "### AWS auth" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ] && [ "${{ vars.AWS_USE_OIDC }}" = "true" ]; then
            echo "- mode: **OIDC**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- mode: **access keys** (OIDC 쓰려면 Variable \`AWS_USE_OIDC=true\` + \`AWS_ROLE_ARN\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Debug GitHub OIDC token claims
        if: steps.auth.outputs.mode == 'oidc'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            const slim = {
              sub: payload.sub,
              aud: payload.aud,
              repository: payload.repository,
              repository_owner: payload.repository_owner,
              ref: payload.ref,
              environment: payload.environment || null,
              job_workflow_ref: payload.job_workflow_ref || null,
            };
            console.log('OIDC claims:', JSON.stringify(slim, null, 2));
            core.summary.addHeading('OIDC claims').addCodeBlock(JSON.stringify(slim, null, 2), 'json');

      - name: Configure AWS credentials (OIDC)
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: steps.auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      # 기존 클러스터: EKS 가 자동 생성한 EC2_LINUX entry 가 있으면 충돌 방지용 import
      - name: Import node Access Entry if present
        run: |
          set +e
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          CLUSTER=aniverse-eks
          PRINCIPAL="arn:aws:iam::${ACCOUNT}:role/aniverse-eks-node-role"
          if aws eks describe-access-entry \
            --region "${AWS_REGION}" \
            --cluster-name "${CLUSTER}" \
            --principal-arn "${PRINCIPAL}" >/dev/null 2>&1; then
            terraform import -input=false \
              'module.eks.aws_eks_access_entry.nodes' \
              "${CLUSTER}:${PRINCIPAL}" \
              && echo "Imported node access entry" \
              || echo "Import skipped (already in state)"
          else
            echo "No existing node access entry — apply will create it"
          fi
          set -e

      - name: Terraform apply
        run: |
          terraform apply -auto-approve -input=false
          echo "### Terraform Outputs" >> "$GITHUB_STEP_SUMMARY"
          terraform output >> "$GITHUB_STEP_SUMMARY"

      - name: Print values for app / ops
        run: |
          echo "### Next steps" >> "$GITHUB_STEP_SUMMARY"
          echo "- APP_URL=$(terraform output -raw app_url 2>/dev/null || true)" >> "$GITHUB_STEP_SUMMARY"
          echo "- STATIC_BUCKET_NAME=$(terraform output -raw static_bucket_name)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ECR=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "- EKS=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_STEP_SUMMARY"
          echo "- NS: \`terraform output route53_name_servers\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- kubeconfig: \`$(terraform output -raw eks_kubeconfig_hint)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- helm + DNS: anime-project \`./scripts/eks-bind-domain.sh\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- S3 media/static: Sync media → S3 워크플로(아래 job) 또는 \`scripts/restore-s3-assets.sh\`" >> "$GITHUB_STEP_SUMMARY"

  # destroy(force_destroy) 후 빈 버킷 → git 의 media/static 재업로드
  restore-s3-assets:
    name: Restore S3 media+static after apply
    needs: apply
    uses: ./.github/workflows/sync-media-s3.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  destroy:
    name: Terraform Destroy (keep Route53 + ACM)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev
    env:
      AWS_REGION: ap-northeast-2
      TF_VERSION: "1.10.5"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve AWS auth mode
        id: auth
        run: |
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ] && [ "${{ vars.AWS_USE_OIDC }}" = "true" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug GitHub OIDC token claims
        if: steps.auth.outputs.mode == 'oidc'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            const slim = {
              sub: payload.sub,
              aud: payload.aud,
              repository: payload.repository,
              ref: payload.ref,
              environment: payload.environment || null,
              job_workflow_ref: payload.job_workflow_ref || null,
            };
            console.log('OIDC claims:', JSON.stringify(slim, null, 2));
            await core.summary
              .addHeading('OIDC claims (destroy)')
              .addCodeBlock(JSON.stringify(slim, null, 2), 'json')
              .write();

      - name: Configure AWS credentials (OIDC)
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: steps.auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy (keep Route53 zone + ACM)
        working-directory: .
        run: |
          chmod +x scripts/terraform-destroy-keep-dns.sh scripts/terraform-destroy-preflight.sh
          ./scripts/terraform-destroy-keep-dns.sh
          echo "### DNS preserved" >> "$GITHUB_STEP_SUMMARY"
          echo "- Route53 hosted zone + ACM kept (Gabia NS unchanged)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preflight: node Access Entry + orphan ALB/EIP/ENI cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Re-apply → helm → \`./scripts/terraform-rebind-eks-dns.sh\`" >> "$GITHUB_STEP_SUMMARY"
