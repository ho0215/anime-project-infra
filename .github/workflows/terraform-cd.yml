name: "Terraform CD (Apply / Destroy)"

on:
  push:
    branches:
      - main
    paths:
      - "environments/dev/**"
      - "modules/**"
      - "bootstrap/**"
      - ".github/workflows/terraform*.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "apply 또는 destroy"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply
      restore_from_latest_snapshot:
        description: "destroy 후 재apply 시 최신 manual 스냅샷 복원"
        required: false
        type: boolean
        default: false
      db_snapshot_identifier:
        description: "복원할 스냅샷 ID (비우면 시크릿/자동 정책 사용)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform Apply
    if: >
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    # environment 제거: OIDC sub 가 environment:* 로 바뀌며 trust 불일치가 잦음
    defaults:
      run:
        working-directory: environments/dev
    env:
      AWS_REGION: ap-northeast-2
      TF_VERSION: "1.10.5"
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_django_secret_key: ${{ secrets.TF_VAR_DJANGO_SECRET_KEY }}
      TF_VAR_gemini_api_key: ${{ secrets.TF_VAR_GEMINI_API_KEY }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve AWS auth mode
        id: auth
        run: |
          # OIDC 는 Variable AWS_USE_OIDC=true 일 때만 사용 (기본은 Access Key로 진행 가능)
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ] && [ "${{ vars.AWS_USE_OIDC }}" = "true" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          fi
          echo "### AWS auth" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ] && [ "${{ vars.AWS_USE_OIDC }}" = "true" ]; then
            echo "- mode: **OIDC**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- mode: **access keys** (OIDC 쓰려면 Variable \`AWS_USE_OIDC=true\` + \`AWS_ROLE_ARN\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Debug GitHub OIDC token claims
        if: steps.auth.outputs.mode == 'oidc'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            const slim = {
              sub: payload.sub,
              aud: payload.aud,
              repository: payload.repository,
              repository_owner: payload.repository_owner,
              ref: payload.ref,
              environment: payload.environment || null,
              job_workflow_ref: payload.job_workflow_ref || null,
            };
            console.log('OIDC claims:', JSON.stringify(slim, null, 2));
            core.summary.addHeading('OIDC claims').addCodeBlock(JSON.stringify(slim, null, 2), 'json');

      - name: Configure AWS credentials (OIDC)
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: steps.auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve snapshot restore TF_VARs
        id: snap
        run: |
          SNAP="${{ github.event.inputs.db_snapshot_identifier }}"
          if [ -z "$SNAP" ]; then
            SNAP="${{ secrets.TF_VAR_DB_SNAPSHOT_IDENTIFIER }}"
          fi
          echo "snapshot_id=$SNAP" >> "$GITHUB_OUTPUT"

          RESTORE="${{ github.event.inputs.restore_from_latest_snapshot }}"
          if [ -z "$RESTORE" ]; then
            RESTORE="${{ vars.TF_VAR_RESTORE_FROM_LATEST_SNAPSHOT }}"
          fi
          if [ "$RESTORE" != "true" ]; then
            RESTORE="false"
          fi
          echo "restore_latest=$RESTORE" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        env:
          TF_VAR_db_snapshot_identifier: ${{ steps.snap.outputs.snapshot_id }}
          TF_VAR_restore_from_latest_snapshot: ${{ steps.snap.outputs.restore_latest }}
        run: |
          terraform apply -auto-approve -input=false
          echo "### Terraform Outputs" >> "$GITHUB_STEP_SUMMARY"
          terraform output >> "$GITHUB_STEP_SUMMARY"

      - name: Print values for GitHub Secrets (app repo)
        run: |
          echo "Register these in the **anime-project** repository secrets/vars:" >> "$GITHUB_STEP_SUMMARY"
          echo "- S3_BUCKET_NAME=$(terraform output -raw deploy_bucket_name)" >> "$GITHUB_STEP_SUMMARY"
          echo "- CODE_DEPLOY_APP_NAME=$(terraform output -raw codedeploy_app_name)" >> "$GITHUB_STEP_SUMMARY"
          echo "- CODE_DEPLOY_GROUP_NAME=$(terraform output -raw codedeploy_group_name)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ALB_URL=$(terraform output -raw alb_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "- APP_URL=$(terraform output -raw app_url 2>/dev/null || true)" >> "$GITHUB_STEP_SUMMARY"
          echo "- STATIC_BUCKET_NAME=$(terraform output -raw static_bucket_name)" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait until ASG instances are SSM Online
        working-directory: .
        env:
          ASG_NAME: aniverse-asg
          AWS_REGION: ap-northeast-2
          TIMEOUT_SEC: "900"
        run: bash scripts/wait-for-ssm.sh

      - name: Record SSM connect hint
        run: |
          echo "### SSM access" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "ASG_NAME=$(terraform output -raw asg_name) ./scripts/ssm-connect.sh" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Terraform Destroy (keeps RDS final snapshot)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev
    env:
      AWS_REGION: ap-northeast-2
      TF_VERSION: "1.10.5"
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_django_secret_key: ${{ secrets.TF_VAR_DJANGO_SECRET_KEY }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve AWS auth mode
        id: auth
        run: |
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ] && [ "${{ vars.AWS_USE_OIDC }}" = "true" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: steps.auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy
        run: terraform destroy -auto-approve -input=false

      - name: Find newest final/manual snapshot for aniverse-rds
        id: snapshot
        run: |
          SNAP=$(aws rds describe-db-snapshots \
            --db-instance-identifier aniverse-rds \
            --snapshot-type manual \
            --query 'sort_by(DBSnapshots,&SnapshotCreateTime)[-1].DBSnapshotIdentifier' \
            --output text 2>/dev/null || echo "None")
          echo "id=$SNAP" >> "$GITHUB_OUTPUT"
          echo "### Destroy complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Latest manual snapshot: \`$SNAP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Re-apply with restore:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Set repo secret \`TF_VAR_DB_SNAPSHOT_IDENTIFIER\` = \`$SNAP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "   **or** run workflow_dispatch apply with restore_from_latest_snapshot=true" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Run Apply" >> "$GITHUB_STEP_SUMMARY"
