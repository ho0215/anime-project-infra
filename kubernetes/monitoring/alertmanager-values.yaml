alertmanager:
  enabled: true

  config:
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack-notifications'

    receivers:
      - name: 'slack-notifications'
        slack_configs:
          - channel: '#aniverse-alerts'
            send_resolved: true
            api_url_file: /etc/alertmanager/secrets/slack-webhook-url/url
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: |
              *네임스페이스:* {{ .CommonLabels.namespace }}
              *심각도:* {{ .CommonLabels.severity }}
              *설명:* {{ .CommonAnnotations.description }}

  serviceMonitor:
    enabled: true

  alertmanagerSpec:
    secrets:
      - slack-webhook-url
