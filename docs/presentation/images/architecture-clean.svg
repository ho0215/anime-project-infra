<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Aniverse AWS Architecture</text>
  <text x="640" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Public ALB · Private App/DB · S3 · SSM</text>

  <!-- Users -->
  <rect x="40" y="160" width="140" height="80" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="110" y="207" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#0f172a">Users</text>

  <!-- ALB -->
  <rect x="240" y="150" width="200" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="190" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1e3a8a">ALB (Public)</text>
  <text x="340" y="218" text-anchor="middle" font-family="Arial" font-size="13" fill="#1e40af">/health/ · HTTP:80</text>

  <!-- ASG -->
  <rect x="520" y="130" width="280" height="140" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="660" y="165" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#115e59">ASG / EC2 (Private)</text>
  <rect x="545" y="185" width="100" height="55" rx="8" fill="#ffffff" stroke="#0d9488"/>
  <text x="595" y="218" text-anchor="middle" font-family="Arial" font-size="13" fill="#134e4a">nginx</text>
  <rect x="665" y="185" width="110" height="55" rx="8" fill="#ffffff" stroke="#0d9488"/>
  <text x="720" y="210" text-anchor="middle" font-family="Arial" font-size="12" fill="#134e4a">Daphne</text>
  <text x="720" y="228" text-anchor="middle" font-family="Arial" font-size="12" fill="#134e4a">Django</text>

  <!-- arrows top -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="180" y1="200" x2="235" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="200" x2="515" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- bottom services -->
  <rect x="420" y="380" width="180" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="510" y="420" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#92400e">RDS MariaDB</text>
  <text x="510" y="445" text-anchor="middle" font-family="Arial" font-size="12" fill="#b45309">Private Subnet</text>

  <rect x="640" y="380" width="180" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="730" y="420" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#5b21b6">S3</text>
  <text x="730" y="445" text-anchor="middle" font-family="Arial" font-size="12" fill="#6d28d9">static / media / deploy</text>

  <rect x="860" y="380" width="160" height="90" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="940" y="420" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#9d174d">EFS</text>
  <text x="940" y="445" text-anchor="middle" font-family="Arial" font-size="12" fill="#be185d">shared media</text>

  <rect x="1040" y="160" width="180" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1130" y="200" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#065f46">SSM</text>
  <text x="1130" y="225" text-anchor="middle" font-family="Arial" font-size="12" fill="#047857">Session Manager</text>

  <line x1="660" y1="270" x2="510" y2="375" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="270" x2="730" y2="375" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="270" x2="920" y2="375" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="200" x2="1035" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="520" width="1200" height="140" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="70" y="560" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">Key Points</text>
  <text x="70" y="595" font-family="Arial" font-size="14" fill="#334155">• ALB 모듈 분리 (compute와 분리, Terraform moved → 무중단/무재생성)</text>
  <text x="70" y="625" font-family="Arial" font-size="14" fill="#334155">• Private App + RDS / Public ALB only · CodeDeploy + GitHub Actions 자동화</text>
  <text x="70" y="655" font-family="Arial" font-size="14" fill="#334155">• Daphne(ASGI) WebSocket · Gemini Chatbot · S3 Media</text>
</svg>
